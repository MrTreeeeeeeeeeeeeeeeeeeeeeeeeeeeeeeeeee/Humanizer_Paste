[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keymimic"
version = "1.0.0"
description = "Windows desktop utility for human-like clipboard typing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10",
    "pytest-cov>=5,<8",
    "pytest-qt>=4.4,<5",
    "pyinstaller>=6.7,<7",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
]

[project.scripts]
keymimic = "keymimic.app:main"

[project.gui-scripts]
keymimic-gui = "keymimic.app:main"

[tool.setuptools.packages.find]
include = ["keymimic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["keymimic"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["build", "dist"]
